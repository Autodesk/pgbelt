name: Update Python support

on:
  schedule:
    # Daily, so the PR branch is regularly rebuilt on top of the latest main.
    - cron: "0 10 * * *"
  push:
    # Rebuild the PR right away when files it touches change on main,
    # so it never sits with merge conflicts.
    branches:
      - main
    paths:
      - pyproject.toml
      - poetry.lock
      - Makefile
      - .github/workflows/ci.yml
      - .github/workflows/update-python-support.yml
      - .github/scripts/update_python_support.py
  workflow_dispatch:

concurrency:
  group: update-python-support
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-python-support:
    name: Update supported Python versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # create-pull-request can't authenticate ("could not read Username")
          # with checkout's default GITHUB_TOKEN credentials since checkout v6.
          token: ${{ secrets.PGBELT_GHA_VJEEVA_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install poetry requests

      - name: Update Python support files from official source
        run: python .github/scripts/update_python_support.py

      - name: Refresh lock file metadata
        run: poetry lock

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PGBELT_GHA_VJEEVA_PAT }}
          branch-token: ${{ secrets.PGBELT_GHA_VJEEVA_PAT }}
          title: "ci: update supported Python versions"
          commit-message: "ci: update supported Python versions"
          body: |
            ## Summary
            - fetch currently supported released Python versions from https://devguide.python.org/versions/
            - update CI matrix, Makefile matrix, and `pyproject.toml` Python constraint
            - refresh `poetry.lock`
          branch: chore/update-python-support
          delete-branch: true
