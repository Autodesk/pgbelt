
name: Update usage docs

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/usage.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-usage:
    name: Regenerate usage.md
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          # create-pull-request can't authenticate ("could not read Username")
          # with checkout's default GITHUB_TOKEN credentials since checkout v6.
          token: ${{ secrets.PGBELT_GHA_VJEEVA_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install pgbelt
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Generate usage docs
        run: make generate-usage-docs

      - name: Create PR with docs changes
        uses: peter-evans/create-pull-request@v8
        with:
          # Push and open the PR with the PAT, not GITHUB_TOKEN. Events from
          # GITHUB_TOKEN don't trigger workflows, and pushes by the
          # github-actions bot need a maintainer to approve each CI run, so
          # the docs PR sat with no CI. Same setup as update-python-support.yml.
          token: ${{ secrets.PGBELT_GHA_VJEEVA_PAT }}
          branch-token: ${{ secrets.PGBELT_GHA_VJEEVA_PAT }}
          commit-message: "docs: update usage docs"
          title: "docs: update usage docs"
          body: "Auto-generated usage docs update."
          branch: auto/update-usage-docs
          delete-branch: true
          add-paths: docs/usage.md
